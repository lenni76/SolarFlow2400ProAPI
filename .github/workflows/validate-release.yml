name: Validate and release

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install -r tests/requirements.txt ruff==0.17.1
      - run: python -m unittest discover -s tests -v
      - run: python -m ruff check custom_components tests ha_tests scripts
      - run: python -m ruff format --check custom_components tests ha_tests scripts

  homeassistant:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install -r ha_tests/requirements.txt
      - run: python -m pytest -q ha_tests --timeout=60

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hacs/action@main
        with:
          category: integration
          # Custom repository: central brands registration and discovery topics
          # are not prerequisites for this existing HACS installation.
          ignore: brands topics

  preserve-baseline:
    if: github.event_name == 'push' && github.repository == 'lenni76/SolarFlow2400ProAPI'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Preserve the unchanged 1.2.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py --baseline-only

  release:
    needs: [isolated, homeassistant, hassfest, hacs, preserve-baseline]
    if: github.event_name == 'push' && github.repository == 'lenni76/SolarFlow2400ProAPI'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Publish exactly the checked commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py
